# Add inside the www.bitfsae.com Nginx server {} block (alongside /console/).
# Also add a Tencent EdgeOne rule engine entry for /tidoc-hub/* to bypass CDN cache.

location = /tidoc-hub {
    return 301 /tidoc-hub/;
}

location ^~ /tidoc-hub/ {
    proxy_pass http://127.0.0.1:8767;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # JSON metadata only; binary attachments go directly to Tencent Cloud COS via presigned URLs.
    client_max_body_size 4m;
    proxy_read_timeout 30s;

    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
