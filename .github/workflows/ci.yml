name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-print.txt

      - name: Verify adapter resources, examples and CLI
        run: >-
          python -m pytest -q tests/test_adapter_tools.py tests/test_adapter_resources.py
          tests/test_adapters.py tests/test_adapter_templates.py tests/test_adapter_exports.py
          tests/test_print.py

      - name: Run tests
        run: pytest -q
